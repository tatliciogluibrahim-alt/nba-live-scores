<!doctype html><html><head><meta charset="utf-8"><title>NFL Live Activity mock — v1.0.3 shot 4 placeholder</title>
<!-- The shipped System D ink-board Live Activity (native-15.html treatment A,
     the one in production) carrying NFL content: the real 2026 opener fixture
     (NE at SEA, Sep 9) with the same illustrative in-game state as shot 1.
     PLACEHOLDER until a real device screenshot lands (Sep 10-13). -->
<style>
:root{--wc:#1e6b3c;--conk:rgba(241,234,216,.92);--conkd:rgba(241,234,216,.55);--lineonk:rgba(241,234,216,.18)}
body{background:#e9e2d2;font-family:-apple-system,sans-serif;margin:0;padding:30px}
.mono{font-family:ui-monospace,"JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.la{border-radius:22px;padding:16px 18px;width:378px}
.la.ink{background:#161210;color:var(--conk)}
.lahead{display:flex;justify-content:space-between;font-size:10px;font-weight:600}
.laboard{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.laboard .t{font-size:17px;font-weight:800;letter-spacing:.06em}
.laboard .s{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:.9}
.larail{height:2px;margin-top:14px;position:relative;background:var(--lineonk)}
.larail .f{position:absolute;left:0;top:0;bottom:0;width:66%;background:var(--wc)}
.larail .n{position:absolute;left:66%;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--wc)}
.lafoot{display:flex;justify-content:space-between;font-size:9px;margin-top:6px}
.la.ink .dim{color:var(--conkd)}
</style></head><body>
<div class="la ink">
  <div class="lahead mono"><span class="dim">&#9679; Live &middot; Week 1</span><span style="color:#f1ead8">Q3 4:31</span></div>
  <div class="laboard"><span class="t mono">NE</span><span class="s">17&ndash;24</span><span class="t mono">SEA</span></div>
  <div class="larail"><div class="f"></div><div class="n"></div></div>
  <div class="lafoot mono dim"><span>Kickoff</span><span>Final</span></div>
</div>
</body></html>
