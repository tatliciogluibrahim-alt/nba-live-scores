name: send-briefs-cron

on:
  # Scheduled trigger disabled 2026-05-29 — cron-job.org now sends the
  # Brief daily (8:30am ET). IMPORTANT: the brief has no "already sent
  # today" guard, so running both schedulers would double-send. Leave
  # this commented unless cron-job.org is down. Kept as a fallback.
  # schedule:
  #   - cron: '30 12 * * *'
  workflow_dispatch:

# Least-privilege: this workflow only curls an external endpoint. It
# needs no repo write access. (Matches scan-nba / scan-wc.)
permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily Brief send
        run: |
          # --retry handles transient 5xx so one bad run doesn't leave a
          # noisy failed entry in the Actions history. The endpoint
          # returns 200 even when individual sends fail (per-subscriber
          # fault isolation), so a non-200 here means auth/route trouble.
          curl -fsS \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nonoisescores.app/api/cron/send-briefs
