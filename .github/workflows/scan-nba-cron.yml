name: scan-nba-cron

on:
  # Scheduled trigger disabled 2026-05-29 — cron-job.org now drives this
  # (GitHub Actions cron is unreliable: it delays and silently skips
  # runs). Kept here, commented, so we can re-enable as a fallback.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

# Least-privilege: this workflow only curls an external endpoint. It
# needs no repo write access. (Codex QA #6.)
permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger NBA push scan
        run: |
          # --retry handles transient 5xx from the cron endpoint so a
          # single bad upstream NBA fetch doesn't leave a noisy failed
          # run in the Actions history. (Codex QA #7.)
          curl -fsS \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nonoisescores.app/api/cron/scan-nba
