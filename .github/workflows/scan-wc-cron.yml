name: scan-wc-cron

on:
  # Scheduled trigger disabled 2026-05-29 — cron-job.org now drives this
  # (GitHub Actions cron is unreliable). Kept here, commented, as a
  # fallback. cron-job.org runs WC at a tighter cadence during matches.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:

# Least-privilege: this workflow only curls an external endpoint. It
# needs no repo write access.
permissions: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger World Cup push scan
        run: |
          # --retry handles transient 5xx from the cron endpoint so a
          # single bad upstream WC fetch doesn't leave a noisy failed
          # run in the Actions history.
          curl -fsS \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://nonoisescores.app/api/cron/scan-wc
